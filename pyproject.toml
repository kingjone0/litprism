[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litprism"
version = "1.0.0"
description = "文献棱镜 LitPrism —— 面向个人学术研究的论文知识解读 Agent（结构化解读 · 真实性核验 · 问答 · 对比 · 推荐）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["academic", "research", "paper", "agent", "RAG", "anti-hallucination", "literature-review"]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.scripts]
litprism = "litprism.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"litprism.web" = ["static/*.html"]

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
