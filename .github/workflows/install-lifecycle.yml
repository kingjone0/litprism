name: install-lifecycle

# 只手动触发：安装包 258MB，不该在每次 push 时跑。
# 方案与覆盖边界见 docs/安装生命周期CI方案-2026-10-29.md
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '含安装包的 Release tag'
        required: true
        default: 'v1.0.0'
      old_tag:
        description: '跨版本升级对照用的旧版 tag'
        required: true
        default: 'v0.1.2'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 下载安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pkg" | Out-Null
          gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" `
            --pattern "LitPrism-Setup-*.exe" --dir "$env:RUNNER_TEMP\pkg"
          $f = Get-ChildItem "$env:RUNNER_TEMP\pkg\LitPrism-Setup-*.exe"
          "包: $($f.Name)  $($f.Length) 字节"
          if ($f.Length -lt 100MB) { throw "安装包大小异常: $($f.Length)" }

      - name: 静默安装
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP\pkg\LitPrism-Setup-*.exe").FullName
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          "退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "安装失败 $($p.ExitCode)" }

      - name: 校验落位
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\LitPrism"
          $need = @('LitPrism.exe', 'resources\litprism-sidecar.exe', 'Uninstall LitPrism.exe')
          foreach ($f in $need) {
            $path = Join-Path $dir $f
            if (-not (Test-Path $path)) { throw "缺文件: $path" }
            "OK  $f  ($([math]::Round((Get-Item $path).Length/1MB,1)) MB)"
          }

      - name: 启动并确认内置 sidecar
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\LitPrism"
          $app = Start-Process (Join-Path $dir 'LitPrism.exe') -PassThru
          $sc = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 3
            $sc = Get-CimInstance Win32_Process -Filter "Name='litprism-sidecar.exe'"
            if ($sc) { break }
          }
          if (-not $sc) { throw "90 秒内 sidecar 未启动" }
          $paths = @($sc | ForEach-Object { $_.ExecutablePath } | Sort-Object -Unique)
          $paths | ForEach-Object { "sidecar 进程: $_" }
          # 关键断言：跑的是包内二进制，不是系统 Python
          if ($paths -match 'python') { throw "sidecar 由 python 启动: $($paths -join '; ')" }
          if (-not ($paths -match [regex]::Escape($dir))) { throw "sidecar 不在安装目录: $($paths -join '; ')" }

          $dataDir = "$env:APPDATA\LitPrism"
          if (-not (Test-Path $dataDir)) { throw "数据目录未创建: $dataDir" }
          "数据目录: $dataDir"
          "DATA_DIR=$dataDir" | Out-File "$env:GITHUB_ENV" -Append -Encoding utf8

          'keep-me' | Out-File (Join-Path $dataDir 'ci-retention.marker') -Encoding utf8

          $scProcessId = ($sc | Select-Object -First 1).ProcessId
          $scPorts = @(Get-NetTCPConnection -OwningProcess $scProcessId -State Listen -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty LocalPort)
          "sidecar PID=$scProcessId  监听端口=$($scPorts -join ',')"
          "SC_PORTS=$($scPorts -join ',')" | Out-File "$env:GITHUB_ENV" -Append -Encoding utf8

      - name: 正常退出并核对进程回收
        shell: pwsh
        run: |
          # 通过单实例 IPC 触发正常退出：第二个实例带 --quit，主进程走 before-quit → stopSidecar。
          # 不依赖窗口句柄 —— 无窗口环境里窗口可能是隐藏的。
          $dir = "$env:LOCALAPPDATA\Programs\LitPrism"
          $main = Get-Process LitPrism -ErrorAction SilentlyContinue |
            Sort-Object StartTime | Select-Object -First 1
          if (-not $main) { throw '应用进程不存在，无法验证正常退出' }
          $mainPid = $main.Id

          $sender = Start-Process (Join-Path $dir 'LitPrism.exe') -ArgumentList '--quit' -Wait -PassThru
          "退出命令退出码: $($sender.ExitCode)"

          $gone = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (-not (Get-Process -Id $mainPid -ErrorAction SilentlyContinue)) { $gone = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $gone) { throw "30 秒内主进程 $mainPid 未退出" }
          "应用进程已正常退出"

          $left = $null
          for ($i = 0; $i -lt 20; $i++) {
            $left = Get-Process litprism-sidecar -ErrorAction SilentlyContinue
            if (-not $left) { break }
            Start-Sleep -Seconds 1
          }
          if ($left) { throw "正常退出后 sidecar 仍残留: $($left.Id -join ',')" }
          "sidecar 进程已回收"

          foreach ($port in (@($env:SC_PORTS -split ',') | Where-Object { $_ })) {
            $holder = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            if ($holder) { throw "退出后端口 $port 仍被占用: $($holder.OwningProcess -join ',')" }
          }
          "监听端口已释放"

      - name: 静默卸载
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\LitPrism"
          $un = Join-Path $dir 'Uninstall LitPrism.exe'
          $p = Start-Process $un -ArgumentList '/S' -Wait -PassThru
          "退出码: $($p.ExitCode)"
          Start-Sleep -Seconds 10
          if (Test-Path (Join-Path $dir 'LitPrism.exe')) { throw '卸载后主程序仍在' }
          "卸载后主程序已移除"

      - name: 重装并核对数据保留
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP\pkg\LitPrism-Setup-*.exe").FullName
          # NSIS 在干净 VM 上偶发 0xC0000005（-1073741819）；最多重试 3 次，全部失败才认定失败
          $p = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -eq 0) { break }
            "重装第 $attempt 次失败，退出码 $($p.ExitCode)"
            Start-Sleep -Seconds 10
          }
          if ($p.ExitCode -ne 0) { throw "重装失败 $($p.ExitCode)" }
          $marker = Join-Path $env:DATA_DIR 'ci-retention.marker'
          if (-not (Test-Path $marker)) { throw "重装后数据丢失: $marker" }
          "数据保留 OK: $((Get-Content $marker).Trim())"

      - name: 下载旧版安装包（升级对照）
        if: ${{ inputs.release_tag != inputs.old_tag }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\oldpkg" | Out-Null
          gh release download "${{ inputs.old_tag }}" --repo "${{ github.repository }}" `
            --pattern "LitPrism-Setup-*.exe" --dir "$env:RUNNER_TEMP\oldpkg"
          $old = Get-ChildItem "$env:RUNNER_TEMP\oldpkg\LitPrism-Setup-*.exe" | Select-Object -First 1
          if (-not $old) { throw "没有找到 ${{ inputs.old_tag }} 安装包" }
          Move-Item $old.FullName "$env:RUNNER_TEMP\oldpkg\LitPrism-Setup-old.exe" -Force
          "旧版安装包: $($old.Name) -> LitPrism-Setup-old.exe"

      - name: 跨版本升级（旧版 → 当前 tag）
        if: ${{ inputs.release_tag != inputs.old_tag }}
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\LitPrism"
          $un = Join-Path $dir 'Uninstall LitPrism.exe'
          $p = Start-Process $un -ArgumentList '/S' -Wait -PassThru
          Start-Sleep -Seconds 10
          if (Test-Path (Join-Path $dir 'LitPrism.exe')) { throw '升级前卸载失败' }

          $old = "$env:RUNNER_TEMP\oldpkg\LitPrism-Setup-old.exe"
          $p = Start-Process $old -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "安装旧版失败 $($p.ExitCode)" }
          'upgrade-from-${{ inputs.old_tag }}' | Out-File (Join-Path $env:DATA_DIR 'ci-upgrade.marker') -Encoding utf8
          "旧版已装，写入升级标记"

          $new = (Get-ChildItem "$env:RUNNER_TEMP\pkg\LitPrism-Setup-*.exe").FullName
          $p = Start-Process $new -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "覆盖升级失败 $($p.ExitCode)" }
          Start-Sleep -Seconds 5

          $marker = Join-Path $env:DATA_DIR 'ci-upgrade.marker'
          if (-not (Test-Path $marker)) { throw "升级后数据丢失: $marker" }
          if ((Get-Content $marker).Trim() -ne 'upgrade-from-${{ inputs.old_tag }}') { throw '升级后标记被改写' }
          $sc = Get-Item (Join-Path $dir 'resources\litprism-sidecar.exe')
          if ($sc.Length -lt 100MB) { throw "升级后 sidecar 异常: $($sc.Length)" }
          "跨版本升级 OK：标记保留、sidecar 落位 $([math]::Round($sc.Length/1MB,1)) MB"
